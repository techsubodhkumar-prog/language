
services:
  - type: web
    name: activity-discovery-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: backend

    buildCommand: npm ci && npm run build && npm run db:migrate
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: API_PREFIX
        value: api/v1

      - key: DATABASE_URL
        sync: false

      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_ANON_KEY
        sync: false

      - key: CORS_ORIGIN
        value: "*"

      - key: FIREBASE_PROJECT_ID
        sync: false

      - key: FIREBASE_CLIENT_EMAIL
        sync: false

      - key: FIREBASE_PRIVATE_KEY
        sync: false

      - key: FCM_SERVER_KEY
        sync: false
